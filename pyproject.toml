[project]
name = "asof"
version = "0.1.0"
description = "Point-in-time correct market research agent: scan, cite, judge, simulate, attribute, evolve."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "sqlmodel>=0.0.21",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.scripts]
asof = "asof.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
