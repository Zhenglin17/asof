# Human decisions the instrument-class build applies after the rules. Each entry needs a
# reason; `valid_from` (optional) pins one security-master segment of the symbol. An undated
# entry may only cover segments of one security: a reused ticker needs one dated line per era.
#
# Only symbols that qualified for the liquid tier (ADV > $50M on some month start, 2020-2026)
# while tagged `unknown` are listed; the other ~120 shelf segments never trade enough to matter.
# `asof market liquid --from ... --to ...` lists any new qualified-but-unknown symbol.

- symbol: BAM
  class: common
  valid_from: 2020-01-02
  reason: >-
    Brookfield Asset Management Inc. class A shares, the parent that became Brookfield Corp (BN)
    in December 2022. The SEC name is the issuer's and its CIK lists 20+ note tickers, so the
    shelf rule left it unknown. In the tier 35 months.
- symbol: BAM
  class: common
  valid_from: 2022-12-12
  reason: >-
    Brookfield Asset Management Ltd., the asset manager spun out on 2022-12-12 under the old
    ticker (a different security); same shelf problem until Alpaca's row names it.
- symbol: BAM
  class: common
  valid_from: 2023-01-03
  reason: The same asset manager after the SEC table switched the ticker to its new CIK.
- symbol: NYMT
  class: common
