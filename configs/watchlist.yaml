# Long-term watchlist: instruments that get deep data (filings, fundamentals) on top of the
# market-wide bars every listed symbol receives. Upper groups are market, sector and cross-asset
# funds; lower groups are representative stocks per theme.
#
# `added` is the date an entry joined the list. Entries were chosen with hindsight, so replays of
# market-wide scans must not restrict themselves to this list for dates before `added`.
# `kind` and `added` set on a group apply to every item; an item may override either.
# Quote tickers YAML would read as something else, e.g. "ON" (a boolean when unquoted).

groups:
